<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="KombiPlus v1.0 banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111f38"/>
      <stop offset="1" stop-color="#1b1524"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#e8562a"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffc27a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="1010" cy="80" r="260" fill="url(#glow)"/>
  <circle cx="120" cy="320" r="200" fill="#49b8ff" opacity="0.08"/>

  <!-- logos: thermostat node and relay node -->
  <g transform="translate(96 118)">
    <rect x="0" y="0" width="104" height="104" rx="26" fill="#141e33" stroke="#2b3d61" stroke-width="2"/>
    <rect x="14" y="18" width="76" height="42" rx="8" fill="#0a1220" stroke="#3a4f78" stroke-width="1.5"/>
    <text x="52" y="47" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="24" font-weight="700" fill="#ffb066">21.5</text>
    <circle cx="30" cy="86" r="15" fill="#18243d" stroke="#3a4f78" stroke-width="1.5"/>
    <path d="M30 76v10M24 80l6-4 6 4" stroke="#94a6c3" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="56" y="78" width="34" height="16" rx="8" fill="#ff8a3d" opacity="0.85"/>
    <text x="73" y="90" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="700" fill="#241203">HEAT</text>
  </g>

  <g transform="translate(240 156)" stroke="#4a638f" stroke-width="2" stroke-dasharray="6 7" fill="none">
    <path d="M0 0h56"/>
  </g>
  <text x="268" y="146" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#7d93b8">Wi-Fi · TCP</text>

  <g transform="translate(330 138)">
    <rect x="0" y="0" width="76" height="66" rx="18" fill="#141e33" stroke="#2b3d61" stroke-width="2"/>
    <rect x="14" y="14" width="48" height="26" rx="6" fill="#0a1220" stroke="#3a4f78" stroke-width="1.5"/>
    <path d="M30 27h16" stroke="#2dd47c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="24" cy="52" r="5" fill="#2dd47c"/>
    <text x="38" y="56" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#8fa6c8">RELAY</text>
  </g>

  <!-- text block -->
  <text x="452" y="128" font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif" font-size="52" font-weight="800" fill="#eef4ff" letter-spacing="-0.5">KombiPlus</text>
  <text x="454" y="168" font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif" font-size="20" fill="#9db0ce">Two-node ESP8266 room thermostat for gas boilers</text>

  <g font-family="ui-monospace,Consolas,'Courier New',monospace" font-size="12">
    <rect x="454" y="196" width="96" height="32" rx="16" fill="#1d2c49" stroke="#365075"/>
    <text x="502" y="217" text-anchor="middle" fill="#ffb066">v1.1.0</text>
    <rect x="562" y="196" width="136" height="32" rx="16" fill="#1d2c49" stroke="#365075"/>
    <text x="630" y="217" text-anchor="middle" fill="#cfe0fa">NodeMCU v3</text>
    <rect x="710" y="196" width="196" height="32" rx="16" fill="#1d2c49" stroke="#365075"/>
    <text x="808" y="217" text-anchor="middle" fill="#cfe0fa">ESP8266 core 3.1.2</text>
    <rect x="918" y="196" width="84" height="32" rx="16" fill="#1d2c49" stroke="#365075"/>
    <text x="960" y="217" text-anchor="middle" fill="#8fe0b4">MIT</text>
  </g>

  <text x="454" y="272" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#6f86a8">OLED · Rotary encoder · Web UI · MQTT · Telegram · LittleFS · Fail-safe relay</text>

  <!-- flame mark -->
  <g transform="translate(1090 210)" opacity="0.9">
    <path d="M24 0c6 14 20 18 20 34a20 20 0 0 1-40 0c0-8 4-12 8-18 2 8 6 10 10 12-4-10-4-20 2-28z" fill="url(#flame)"/>
  </g>
</svg>
